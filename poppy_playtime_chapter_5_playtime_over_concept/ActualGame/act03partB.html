<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy Playtime Chapter 5 - Playtime Over (concept)</title>
    <link rel="stylesheet" href="act03partBstyle.css">
</head>
<body>
    <img id="introimage" src="../Background/Act03ScenesandMap/Finalbattleaftermath01.png" alt="imagemissing">

    <div id="dialogbox"></div>

    <button id="finalrpghit" class="act03buttons">Final hit</button>

    <div id="caseswitches">
        <div id="switch1" class="switchofcase">
            <div class="firstpair1">
                <div id="pair1one">1</div>
                <div id="pair1two">2</div>
            </div>
            <div class="secondpair1">
                <div id="pair1three">3</div>
                <div id="pair1four">4</div> 
            </div>
        </div>
        <div id="switch2" class="switchofcase">
            <div class="firstpair2">
                <div id="pair2a">A</div>
                <div id="pair2b">B</div>
            </div>
            <div class="secondpair2">
                <div id="pair2c">C</div>
                <div id="pair2d">D</div>
            </div>
        </div>
    </div>

    <button id="caseopened" class="act03buttons">Let's open</button>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="act03partBscript.js"></script>
    <script src="../helperlocalstoragevalues.js"></script>
</body>
</html>
