<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy Playtime Chapter 5 - Playtime Over (concept)</title>
    <link rel="stylesheet" href="act01style.css">
</head>
<body>
    <img id="introimage" src="../Background/VHSPlayScenario/Gamebeginningscene01.png" alt="wardenvhsbefore">
    <img id="playercharacter" src="../Sprites/Player/Player_basic_omnihand_bluehand_other_usable.png" alt="playerfigure">
    <div id="vhs_scene01">Click on this box over VCR to play VHS!</div>
    
    <div id="dialogbox"></div>
    <button id="startitalready" class="act01buttons eventstartersetA">Alright, let's have it!</button>

    <button id="getoutoflabsection" class="act01buttons eventstartersetA">Open the other door</button>
    <div id="helperbox"></div>
    <button id="startrpgbattle" class="act01buttons eventstartersetB">Prelude before RPG battle</button>
    <button id="boxyfight" class="act01buttons eventstartersetB">Boxy Boo fight</button>
    <div id="hands_to_use">
        <div id="left_hands">
            <img id="bluehand" src="../Tools/Grabpack hands/Blue hand.png" alt="blue_hand">
            <img id="yellowhand" src="../Tools/Grabpack hands/Yellow hand.png" alt="yellow_hand">
        </div>
        <div>
            <h3>Click on the hands to change hand of the grabpack!</h3>
            <h3>Use Q key for left hand and E key for right hand!</h3>
        </div>
        <div id="right_hands">
            <img id="omnihand" src="../Tools/Grabpack hands/Omni hand.png" alt="omni_hand">
            <img id="purplehand" src="../Tools/Grabpack hands/Purple hand.png" alt="purple_hand">
            <img id="flarehand" src="../Tools/Grabpack hands/Flare hand.png" alt="flare_hand">
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="act01script.js"></script>
</body>
</html>
